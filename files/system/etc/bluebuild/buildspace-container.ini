[BuildSpace]
image=quay.io/fedora/fedora:latest
pull=yes

# Core build tools, compilers, and build systems
additional_packages="gcc gcc-c++ clang llvm make cmake ninja-build meson autoconf automake libtool pkgconf bison flex ccache extra-cmake-modules"

# Version control and downloading
additional_packages="git wget curl"

# GTK and GNOME/libadwaita development
additional_packages="gtk3-devel gtk4-devel libadwaita-devel glib2-devel pango-devel gdk-pixbuf2-devel atk-devel"

# Qt development (both Qt5 and Qt6 for legacy and modern apps)
additional_packages="qt5-qtbase-devel qt6-qtbase-devel qt5-qttools-devel qt6-qttools-devel qt6-qtdeclarative-devel qt5-qtwayland-devel qt6-qtwayland-devel"

# KDE development
additional_packages="kf6-ki18n-devel kf6-krunner-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kservice-devel kf6-kcmutils-devel xdg-mime jhead ImageMagick plasma-workspace-devel kf6-kwindowsystem-devel"

# Graphics, Wayland, X11, and Vulkan (Essential for Bazzite/Gaming/Handhelds)
additional_packages="wayland-devel libX11-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel mesa-libGL-devel mesa-libEGL-devel vulkan-headers vulkan-loader-devel"

# Multimedia and Audio
additional_packages="SDL2-devel ffmpeg-free-devel gstreamer1-devel gstreamer1-plugins-base-devel alsa-lib-devel pipewire-devel"

# Scripting and other language runtimes
additional_packages="python3 python3-devel python3-pip python3-setuptools python3-wheel rust cargo golang nodejs npm"

# Debugging and profiling
additional_packages="gdb valgrind strace ltrace"

# Archiving and packaging
additional_packages="tar gzip bzip2 xz unzip p7zip rpm-build flatpak-builder"

# Run a system update and clean the cache immediately after creation to save space
init_hooks="dnf -y upgrade && dnf -y clean all"

