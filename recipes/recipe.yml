# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: workstation
description: "Linux done properly."

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: gschema-overrides
    include:
      - zz1-window-buttons.gschema.override

  - type: dnf
    repos:
      files:
        add:
          - https://download.opensuse.org/repositories/home:paulmcauley/Fedora_44/home:paulmcauley.repo
          - https://download.opensuse.org/repositories/home:luisbocanegra/Fedora_44/home:luisbocanegra.repo
          - https://download.docker.com/linux/fedora/docker-ce.repo
          - protonvpn.repo
          - vscode.repo
          - netbird.repo

      copr:
        enable:
          - infinality/kwin-effects-better-blur-dx
          - atim/starship
          - lionheartp/Hyprland
          - lihaohong/yazi
          - jdxcode/mise
          - aquacash5/nerd-fonts
          - deltacopy/darkly

    install:
      packages:
        # Utilities
        - yazi
        - eza
        - zoxide
        - bat
        - ripgrep
        - fd-find
        - fzf
        - tldr
        - btop
        - gh
        - jq
        - yq
        - unzip
        - wget
        - curl
        - git
        - kitty
        - starship
        - zsh
        - distrobox
        - mise
        - nix

        # The reason VSCode is here instead of the flatpak app section
        # is because a flatpak doesn't have system access,
        # since i want to have only one tool for modifying every file
        # i need to have vscode to have full system access to modify stuff like
        # /etc or similar locations
        - code

        # Virtual Machines
        - qemu-kvm
        - libvirt
        - virt-install
        - edk2-ovmf
        - swtpm
        - qemu-img
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - freerdp
        - winboat-0.9.0-x86_64.rpm
        - uxplay

        # System
        - nwg-look
        - sbsigntools
        - wl-clipboard
        - kde-partitionmanager
        - kde-connect
        - tlp
        - tlp-rdw
        - powertop

        # Fonts
        - rsms-inter-fonts
        - jet-brains-mono-nerd-fonts

        # Theming
        - kvantum
        - klassy
        - kwin-effects-better-blur-dx
        - kwin-effects-better-blur-dx-x11
        - plasma-panel-colorizer
        - darkly
        - kde-material-you-colors
        - matugen
        - plasma-sdk

    remove:
      packages:
        #KDE Debloating
        - kde-gtk-config
        - konsole
        - kwrite
        - kate
        - filelight
        - gnome-disks

  - type: script
    scripts:
      - setup_shell.sh
      - install_vpn.sh
      - setup_windows_vm.sh
    snippets:
      - chmod +x /etc/bluebuild/*

  - type: kargs
    kargs:
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      - split_lock_detect=off
      - nowatchdog=0
      - nmi_watchdog=0
      - usbcore.autosuspend=-1
      - page_alloc.shuffle=1

  - type: systemd
    system:
      enabled:
        - docker.socket
        - nix-daemon.socket
        - virtqemud.socket
        - virtlxcd.socket
        - virtxend.socket
        - virtvboxd.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - nix-daemon
        - nix.mount
        - nix-directory
        - tlp

      disabled:
        - NetworkManager-wait-online.service
        - fedora-atomic-desktop-mandb-update.service
        - systemd-oomd.service
        - docker.service
        - libvirtd.service
        - irqbalance.service

      masked:
        - systemd-udev-settle.service
        - tuned.service
        - tuned-ppd.service
        - systemd-rfkill.service
        - systemd-rfkill.socket
